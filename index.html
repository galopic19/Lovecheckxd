<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Love 💗</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: 'DM Sans', sans-serif;
      background: radial-gradient(circle at 50% 35%, #fff5f8 0%, #ffdce8 45%, #ffbfd4 100%);
      color: #7a183e;
      display: grid;
      place-items: center;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 15%, rgba(255,255,255,.8), transparent 25%), radial-gradient(circle at 80% 80%, rgba(255,255,255,.55), transparent 25%);
      pointer-events: none;
    }
    .card {
      width: min(92vw, 720px);
      min-height: 430px;
      padding: 60px 28px 50px;
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 36px;
      background: rgba(255,255,255,.62);
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 70px rgba(169, 28, 82, .18), inset 0 1px 0 rgba(255,255,255,.9);
      text-align: center;
      position: relative;
      z-index: 2;
    }
    .tiny-heart { font-size: 30px; margin-bottom: 16px; animation: heartbeat 1.5s infinite; }
    h1 {
      margin: 0 auto 12px;
      max-width: 650px;
      font-family: 'Pacifico', cursive;
      font-size: clamp(2.2rem, 7vw, 4.7rem);
      line-height: 1.12;
      color: #d62f68;
      text-shadow: 0 3px 20px rgba(214,47,104,.15);
    }
    .subtitle { margin: 0 0 34px; font-size: 1rem; color: #a24a6c; }
    .buttons { position: relative; height: 100px; display: flex; justify-content: center; align-items: center; gap: 16px; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 15px 28px;
      font: 700 1rem 'DM Sans', sans-serif;
      cursor: pointer;
      user-select: none;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    #yes {
      color: white;
      background: #ed3f78;
      box-shadow: 0 10px 25px rgba(237,63,120,.28);
      animation: pinkRed 1.05s infinite alternate;
    }
    #yes:hover { transform: scale(1.06); }
    #no {
      color: #9b3159;
      background: rgba(255,255,255,.9);
      box-shadow: 0 8px 22px rgba(145,39,81,.12);
      position: relative;
    }
    .hint { margin-top: 20px; font-size: .78rem; color: #c06a89; opacity: .85; }
    .heart {
      position: fixed;
      bottom: -40px;
      left: var(--x);
      font-size: var(--size);
      opacity: 0;
      animation: floatUp var(--duration) linear infinite;
      animation-delay: var(--delay);
      z-index: 1;
      pointer-events: none;
    }
    .success { display: none; }
    .success.show { display: block; animation: pop .7s cubic-bezier(.2,1.5,.4,1); }
    .success h2 { font-family: 'Pacifico', cursive; color: #d62f68; font-size: clamp(2rem, 6vw, 4rem); margin: 0 0 15px; }
    .success p { font-size: 1.05rem; color: #a24a6c; margin: 0; }
    .question.hidden { display: none; }
    .sparkle { display: inline-block; animation: spin 2s linear infinite; }
    canvas { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
    @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg) scale(.8); opacity: 0; } 10% { opacity: .8; } 90% { opacity: .5; } 100% { transform: translateY(-115vh) rotate(360deg) scale(1.15); opacity: 0; } }
    @keyframes pinkRed { 0% { background:#ff4f8b; box-shadow:0 0 10px rgba(255,79,139,.25), 0 10px 25px rgba(237,63,120,.2); } 100% { background:#e31f4f; box-shadow:0 0 28px rgba(227,31,79,.6), 0 10px 30px rgba(227,31,79,.3); } }
    @keyframes heartbeat { 0%,100% { transform:scale(1); } 50% { transform:scale(1.2); } }
    @keyframes pop { from { opacity:0; transform:scale(.7); } to { opacity:1; transform:scale(1); } }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (max-width: 600px) { .card { min-height: 480px; padding-top: 52px; } .buttons { height: 150px; } }
  </style>
</head>
<body>
  <div id="hearts"></div>
  <canvas id="confetti"></canvas>

  <main class="card">
    <section class="question" id="question">
      <div class="tiny-heart">💗</div>
      <h1>You wanna be mine forever? 🥹💕</h1>
      <p class="subtitle">There is only one correct answer, my love.</p>
      <div class="buttons" id="buttonArea">
        <button id="yes">Yes 💖</button>
        <button id="no">Hell no 😭</button>
      </div>
      <div class="hint">P.S. the second button is a little shy...</div>
    </section>

    <section class="success" id="success">
      <div class="tiny-heart">💞</div>
      <h2>YESSSSSSSSSSSSS<br>MY LOVE 💕</h2>
      <p>I LOVE YOU SO MUCH!!! 🥹💗✨</p>
      <p style="margin-top:18px;font-size:1.7rem">💗 💕 💖 💘 💞</p>
    </section>
  </main>

  <script>
    const hearts = document.getElementById('hearts');
    const heartChars = ['♥','❤','💕','💗','💖','💘','♡'];
    for (let i = 0; i < 34; i++) {
      const h = document.createElement('span');
      h.className = 'heart';
      h.textContent = heartChars[Math.floor(Math.random() * heartChars.length)];
      h.style.setProperty('--x', Math.random() * 100 + 'vw');
      h.style.setProperty('--size', (16 + Math.random() * 28) + 'px');
      h.style.setProperty('--duration', (7 + Math.random() * 9) + 's');
      h.style.setProperty('--delay', (-Math.random() * 15) + 's');
      hearts.appendChild(h);
    }

    const noBtn = document.getElementById('no');
    const area = document.getElementById('buttonArea');
    function escapeNo() {
      const areaRect = area.getBoundingClientRect();
      const maxX = Math.max(0, areaRect.width - noBtn.offsetWidth);
      const maxY = Math.max(0, areaRect.height - noBtn.offsetHeight);
      noBtn.style.position = 'absolute';
      noBtn.style.left = Math.random() * maxX + 'px';
      noBtn.style.top = Math.random() * maxY + 'px';
      noBtn.style.transform = `rotate(${Math.random()*12-6}deg)`;
    }
    noBtn.addEventListener('mouseenter', escapeNo);
    noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); escapeNo(); }, {passive:false});
    noBtn.addEventListener('click', (e) => { e.preventDefault(); escapeNo(); });

    document.getElementById('yes').addEventListener('click', () => {
      document.getElementById('question').classList.add('hidden');
      document.getElementById('success').classList.add('show');
      launchConfetti();
    });

    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    let pieces = [];
    function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
    addEventListener('resize', resize); resize();
    function launchConfetti() {
      pieces = Array.from({length: 220}, () => ({
        x: innerWidth/2 + (Math.random()-.5)*180, y: innerHeight*.62,
        vx: (Math.random()-.5)*13, vy: -Math.random()*15-6,
        g: .32 + Math.random()*.15, r: 4+Math.random()*5,
        rot: Math.random()*Math.PI, spin: (Math.random()-.5)*.3,
        shape: Math.random() > .35 ? 'rect' : 'heart'
      }));
      animateConfetti();
    }
    function animateConfetti() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      pieces.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += p.g; p.rot += p.spin;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.font = p.r*2.5 + 'px sans-serif';
        ctx.fillStyle = ['#ff4f8b','#e31f4f','#ff9fbe','#d62f68','#ffcfdd'][Math.floor(Math.random()*5)];
        if (p.shape === 'heart') ctx.fillText('♥', -p.r, p.r); else ctx.fillRect(-p.r, -p.r/2, p.r*2, p.r);
        ctx.restore();
      });
      pieces = pieces.filter(p => p.y < innerHeight + 30);
      if (pieces.length) requestAnimationFrame(animateConfetti); else ctx.clearRect(0,0,canvas.width,canvas.height);
    }
  </script>
</body>
</html>
